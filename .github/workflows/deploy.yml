name: Build and Deploy

on:
  push:
    branches: [master]
  # pull_request:
  #   branches: [master]
  workflow_dispatch:

# Default: deny everything. Each job grants only what it needs.
permissions: {}

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB: secret-scan
  # Scans git history for leaked secrets using Gitleaks.
  # Standalone step, no dependencies.
  # ─────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # JOB 1: build
  # Compiles the source and packages the JAR.
  # Uploads the JAR as a pipeline artifact for downstream jobs.
  # Does NOT run tests — that is test's job.
  # Does NOT build the Docker image — that is docker-push's job.
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"

      # Restore Maven local repository from cache.
      # Cache key = hash of pom.xml — invalidates only when dependencies change.
      # restore-keys fallback ensures partial cache hits on dep additions.
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-

      # -DskipTests: tests are not run here — that is the test job's responsibility.
      # -B: batch mode, no ANSI color codes, clean log output.
      - name: Package JAR (skip tests)
        run: ./mvnw clean package -DskipTests -B

      # Upload the JAR so test and docker-push can use it without recompiling.
      # retention-days: 1 — artifacts are temporary build outputs, not archives.
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # JOB 2: test
  # Downloads the JAR built by 'build'.
  # Runs the test suite against the already-compiled source.
  # No recompilation of main sources. This proves the artifact
  # that will be deployed is the one that was tested.
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.test-type }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    needs: build
    strategy:
      fail-fast: false
      matrix:
        test-type: [unit, integration]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"

      # Same cache key — on the second run this will be a full cache hit.
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-

      # Download the JAR that 'build' produced into target/.
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      # Run only the test phase. Source checkout is required so Maven
      # can compile test sources. Main sources are NOT recompiled —
      # Maven skips compile when the JAR is already present in target/.
      - name: Run tests
        run: ./mvnw test -P${{ matrix.test-type }} -B

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results (${{ matrix.test-type }})
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

  # ─────────────────────────────────────────────────────────────
  # JOB 3: quality
  # Runs in parallel with 'test' — both depend only on 'build'.
  # Downloads the compiled JAR artifact from 'build'.
  # Runs three quality gates sequentially:
  #   1. checkstyle:check   — code style (Google Java style)
  #   2. spotbugs:check     — static bytecode analysis
  #   3. verify             — JaCoCo coverage (must be >= 60%)
  # Uploads the JaCoCo HTML report as a pipeline artifact.
  # ─────────────────────────────────────────────────────────────
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-

      # Download the JAR produced by 'build' so SpotBugs can analyse
      # the compiled bytecode without triggering a recompile.
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      # Gate 1: Code style
      # Fails immediately on any Checkstyle violation not suppressed.
      - name: Checkstyle
        run: ./mvnw checkstyle:check -B

      # Gate 2: Code coverage
      # verify runs: prepare-agent → test → JaCoCo check → JaCoCo report
      # Fails if line coverage drops below 60%.
      - name: JaCoCo coverage check
        run: ./mvnw verify -B

      # Upload the JaCoCo HTML report regardless of success/failure.
      # This allows you to download and inspect coverage even if the threshold fails.
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB: security
  # Runs in parallel with 'test' and 'quality' — depends on 'build'.
  # Runs OWASP Dependency-Check and FindSecBugs (SpotBugs).
  # ─────────────────────────────────────────────────────────────
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-

      - name: Restore NVD database cache
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check
          key: nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            nvd-${{ runner.os }}-
            nvd-

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      # compile is needed to ensure .class files exist for SpotBugs bytecode analysis.
      - name: FindSecBugs (SAST)
        run: ./mvnw compile spotbugs:check -DskipTests -B

      - name: OWASP Dependency-Check
        run: ./mvnw dependency-check:check -B

      - name: Upload OWASP HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: target/dependency-check-report.html
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 4: docker-push
  # Builds the Docker image (the Dockerfile compiles the JAR
  # internally using its own multi-stage build).
  # Uses GHA cache for Docker layers — the expensive dependency
  # download layer is cached across runs.
  # Pushes to GHCR tagged with :latest and :<git-sha>.
  # ─────────────────────────────────────────────────────────────
  docker-push:
    name: Docker Push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # Required to push to GHCR
    needs: [test, quality, security, secret-scan] # Only build the image if all tests and security gates pass

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build with load: true so Trivy can scan it before pushing
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run Trivy vulnerability scanner
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      # Run Push if Trivy scanner passed
      - name: Push Docker image
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

  # ─────────────────────────────────────────────────────────────
  # JOB 4: deploy
  # Unchanged from baseline — rolling deployment to VM over Tailscale.
  # concurrency group prevents two deploys running simultaneously on the VM.
  # cancel-in-progress: false — never cancel a deploy mid-execution.
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: docker-push
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Verify connectivity
        run: tailscale ping --until-direct=false ${{ secrets.VM_HOSTNAME }}

      - name: Configure database secrets on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOSTNAME }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            mkdir -p /opt/springboot-app
            cat << 'EOF' > /opt/springboot-app/.env
            DB_NAME=${{ secrets.DB_NAME || 'cicddb' }}
            DB_USER=${{ secrets.DB_USER || 'postgres' }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            EOF
            chmod 600 /opt/springboot-app/.env

      - name: Copy infra files to VM
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOSTNAME }} "mkdir -p /opt/springboot-app"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key docker-compose.yaml nginx.conf deploy-rolling.sh ${{ secrets.VM_USER }}@${{ secrets.VM_HOSTNAME }}:/opt/springboot-app/

      - name: Execute Rolling Deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOSTNAME }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /opt/springboot-app
            chmod +x deploy-rolling.sh
            ./deploy-rolling.sh ${{ github.sha }}
